[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
filterwarnings = [
    # Emitted inside the pinned Hugging Face stack; TetherFlow does not pass this deprecated argument.
    "ignore:The `local_dir_use_symlinks` argument is deprecated and ignored.*:UserWarning",
    # Emitted by tokenizers while Transformers constructs FLUX.1-dev's CLIP fast tokenizer.
    "ignore::DeprecationWarning:transformers.models.clip.tokenization_clip",
    # Emitted at import time by the torchao version pinned in the CI image.
    "ignore:Importing.*from torchao.dtypes.*:DeprecationWarning",
    # Emitted internally by the pinned PyTorch build when reading legacy TF32 flags.
    "ignore:Please use the new API settings to control TF32 behavior.*:UserWarning",
    # Emitted internally by torch.rms_norm for pretrained checkpoints that keep
    # fp32 norm weights while running bf16 activations (e.g. FLUX).
    "ignore:Mismatch dtype between input and weight.*:UserWarning",
]
